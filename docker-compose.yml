version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: spring-batch-postgres
    restart: always
    environment:
      POSTGRES_DB: batchdb
      POSTGRES_USER: batchuser
      POSTGRES_PASSWORD: batchpass
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql